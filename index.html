<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parceiro Entregador</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#111;color:white;font-family:Arial,sans-serif}
header,.card{padding:20px;border-radius:14px;margin-bottom:16px}
header{background:#ffcc00;color:#111}
.card{background:#222}
h2{color:#ffcc00}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:16px}
button{background:#ffcc00;color:#111;font-weight:bold;cursor:pointer}
.online{background:#138a36;color:white}
.offline{background:#b3261e;color:white}
.status{font-size:22px;font-weight:bold;text-align:center;padding:12px}
.entrega{background:#333;padding:12px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
.hidden{display:none}
small{color:#ccc}
#mensagem{overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<h1>🏍️ Parceiro Entregador</h1>
<p>Seu painel de entregas</p>
</header>

<section class="card" id="login">
<h2>Entrar na sua conta</h2>
<input id="nome" placeholder="Seu nome" autocomplete="name">
<input id="email" type="email" placeholder="Seu e-mail" autocomplete="email">
<input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
<button onclick="cadastrar()">Criar minha conta</button>
<button onclick="entrar()">Entrar</button>
<p id="mensagem"></p>
</section>

<section id="painel" class="hidden">
<div class="card">
<h2>Meu status</h2>
<p id="nomeUsuario"></p>
<div class="status" id="status">🔴 OFFLINE</div>
<button class="online" onclick="mudarStatus(true)">FICAR ONLINE</button>
<button class="offline" onclick="mudarStatus(false)">FICAR OFFLINE</button>
<small>Seu status fica salvo na sua conta.</small>
<button onclick="sair()">Sair da conta</button>
</div>

<div class="card">
<h2>Nova entrega</h2>
<input id="cliente" placeholder="Nome do destinatário">
<input id="telefone" placeholder="Telefone">
<input id="origem" placeholder="Local de retirada">
<input id="destino" placeholder="Endereço de destino">
<input id="referencia" placeholder="Ponto de referência">
<select id="veiculo">
<option value="Moto">Moto</option>
<option value="Bicicleta">Bicicleta</option>
</select>
<input id="distancia" type="number" min="0" step="0.1" placeholder="Distância em km">
<input id="valor" type="number" min="0" step="0.01" placeholder="Valor da entrega em R$">
<button onclick="adicionarEntrega()">Adicionar entrega</button>
</div>

<div class="card">
<h2>Minhas entregas</h2>
<div id="lista"></div>
</div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, onValue
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyAJhAyQeOWdcWKJqPwI2aEate6QYCgIqW0",
  authDomain: "partner-delivery-bbd2a.firebaseapp.com",
  projectId: "parceiro-entregador-bbd2a",
  databaseURL: "https://parceiro-entregador-bbd2a-default-rtdb.firebaseio.com",
  storageBucket: "partner-delivery-bbd2a.firebasestorage.app",
  messagingSenderId: "1042700499445",
  appId: "1:1042700499445:web:6946501fec49f892a688bc",
  measurementId: "G-PGLNRQZ3CJ"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const ADMIN_UID = "Un7Tuu1oK8fZpgmp5Ts7VEDiXYt2";
const CAMINHO_ENTREGADORES = "Entregadores";

let usuarioAtual = null;
let pararEscuta = null;
let entregas = [];

const el = (id) => document.getElementById(id);
const mostrarMensagem = (texto) => { el("mensagem").innerText = texto; };

window.cadastrar = async () => {
  const nome = el("nome").value.trim();
  const email = el("email").value.trim();
  const senha = el("senha").value;
  if (!nome || !email || !senha) {
    mostrarMensagem("Preencha nome, e-mail e senha.");
    return;
  }
  if (senha.length < 6) {
    mostrarMensagem("A senha precisa ter pelo menos 6 caracteres.");
    return;
  }

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, senha);
    await set(ref(db, `${CAMINHO_ENTREGADORES}/${cred.user.uid}`), {
      Nome: nome,
      Email: email,
      Papel: "entregador",
      Online: false,
      Status: "offline",
      CriadoEm: Date.now(),
      UltimaAtividade: Date.now()
    });
    mostrarMensagem("Conta criada com sucesso!");
  } catch (e) {
    mostrarMensagem("Erro ao criar conta: " + e.message);
  }
};

window.entrar = async () => {
  const email = el("email").value.trim();
  const senha = el("senha").value;
  if (!email || !senha) {
    mostrarMensagem("Digite seu e-mail e sua senha.");
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch (e) {
    mostrarMensagem("Erro ao entrar: " + e.message);
  }
};

onAuthStateChanged(auth, async (user) => {
  if (pararEscuta) {
    pararEscuta();
    pararEscuta = null;
  }

  if (!user) {
    usuarioAtual = null;
    entregas = [];
    el("login").classList.remove("hidden");
    el("painel").classList.add("hidden");
    return;
  }

  usuarioAtual = user;
  el("login").classList.add("hidden");
  el("painel").classList.remove("hidden");

  const referenciaUsuario = ref(db, `${CAMINHO_ENTREGADORES}/${user.uid}`);

  try {
    const snapshot = await get(referenciaUsuario);
    if (!snapshot.exists()) {
      await set(referenciaUsuario, {
        Nome: user.email || "Entregador",
        Email: user.email || "",
        Papel: user.uid === ADMIN_UID ? "admin" : "entregador",
        Online: false,
        Status: "offline",
        CriadoEm: Date.now(),
        UltimaAtividade: Date.now()
      });
    }

    pararEscuta = onValue(referenciaUsuario, (snap) => {
      if (!snap.exists()) return;
      const dados = snap.val();
      el("nomeUsuario").innerText = "Olá, " + (dados.Nome || user.email || "Entregador");
      const online = dados.Online === true;
      el("status").innerText = online ? "🟢 ONLINE" : "🔴 OFFLINE";
    }, (erro) => {
      alert("Erro ao carregar status: " + erro.message);
    });
  } catch (e) {
    alert("Erro no banco de dados: " + e.message);
  }
});

window.mudarStatus = async (online) => {
  if (!usuarioAtual) return;
  try {
    await update(ref(db, `${CAMINHO_ENTREGADORES}/${usuarioAtual.uid}`), {
      Online: online,
      Status: online ? "online" : "offline",
      UltimaAtividade: Date.now()
    });
  } catch (e) {
    alert("Não foi possível salvar o status: " + e.message);
  }
};

window.sair = async () => {
  if (usuarioAtual) await window.mudarStatus(false);
  await signOut(auth);
};

window.adicionarEntrega = () => {
  const cliente = el("cliente").value.trim();
  const telefone = el("telefone").value.trim();
  const origem = el("origem").value.trim();
  const destino = el("destino").value.trim();
  const referencia = el("referencia").value.trim();
  const veiculo = el("veiculo").value;
  const distancia = el("distancia").value;
  const valor = el("valor").value;

  if (!cliente || !destino) {
    alert("Preencha o destinatário e o destino.");
    return;
  }

  entregas.push({ cliente, telefone, origem, destino, referencia, veiculo, distancia, valor });
  mostrarEntregas();
  ["cliente","telefone","origem","destino","referencia","distancia","valor"]
    .forEach(id => el(id).value = "");
};

function mostrarEntregas() {
  el("lista").innerHTML = "";
  entregas.forEach((e, i) => {
    const item = document.createElement("div");
    item.className = "entrega";
    const linhas = [
      `Entrega ${i + 1} — ${e.cliente}`,
      `Telefone: ${e.telefone || "-"}`,
      `Retirada: ${e.origem || "-"}`,
      `Destino: ${e.destino}`,
      `Referência: ${e.referencia || "-"}`,
      `Veículo: ${e.veiculo}`,
      `Distância: ${e.distancia || "0"} km`,
      `Valor: R$ ${e.valor || "0"}`
    ];
    linhas.forEach((linha, indice) => {
      if (indice === 0) {
        const forte = document.createElement("b");
        forte.textContent = linha;
        item.appendChild(forte);
      } else {
        item.appendChild(document.createElement("br"));
        item.appendChild(document.createTextNode(linha));
      }
    });
    el("lista").appendChild(item);
  });
}
</script>
</body>
</html>
